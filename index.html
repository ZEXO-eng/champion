<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عرب بيور - لعبة الكلمات العربية</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap');

:root{
    --bg:#070707;
    --bg-soft:#0c0c0c;
    --surface:#11100e;
    --surface-2:#171512;
    --surface-3:#211e18;

    --line:rgba(255,255,255,.075);
    --line-strong:rgba(255,255,255,.13);

    --text:#f7f5ef;
    --text-soft:#d8d2c5;
    --muted:#8d887d;

    --brand:#c7a85a;
    --brand-light:#f1dfae;

    --gold:#b99545;
    --gold-light:#e2c878;
    --gold-dark:#80652c;

    --green:#6e987e;
    --green-light:#a8d0b6;

    --danger:#a66f78;

    --shadow:
        0 30px 80px rgba(0,0,0,.52);

    --radius-xl:24px;
    --radius-lg:18px;
    --radius-md:13px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    min-height:100%;
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    font-family:"Tajawal",Arial,sans-serif;
    color:var(--text);

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(199,168,90,.15),
            transparent 34%
        ),
        radial-gradient(
            circle at 5% 55%,
            rgba(185,149,69,.045),
            transparent 25%
        ),
        linear-gradient(
            145deg,
            #050505 0%,
            #0c0b09 50%,
            #070707 100%
        );

    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background:
        linear-gradient(
            rgba(255,255,255,.009) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.009) 1px,
            transparent 1px
        );

    background-size:48px 48px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 90%
        );

    z-index:0;
}

body::after{
    content:"";
    position:fixed;

    width:520px;
    height:520px;

    top:-300px;
    left:50%;

    transform:translateX(-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(199,168,90,.08),
            transparent 67%
        );

    filter:blur(15px);

    pointer-events:none;
    z-index:0;
}


/* =========================
   PARTICLES
========================= */

#particles{
    position:fixed;
    inset:0;

    pointer-events:none;
    overflow:hidden;

    z-index:0;
}

.particle{
    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:rgba(226,200,120,.22);

    box-shadow:
        0 0 10px rgba(199,168,90,.18);

    animation:
        floatParticle linear infinite;
}

@keyframes floatParticle{
    from{
        transform:
            translate3d(0,30px,0);
        opacity:0;
    }

    15%{
        opacity:.45;
    }

    70%{
        opacity:.22;
    }

    to{
        transform:
            translate3d(14px,-120px,0);
        opacity:0;
    }
}


/* =========================
   APP
========================= */

.app{
    position:relative;
    z-index:2;

    width:min(760px,calc(100% - 28px));

    margin:auto;

    padding-bottom:40px;
}


/* =========================
   HEADER
========================= */

header{
    height:82px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:1px solid var(--line);

    position:relative;
}

.header-brand{
    display:flex;
    align-items:center;
    gap:13px;
}

.brand-mark{
    width:43px;
    height:43px;

    display:grid;
    place-items:center;

    border-radius:14px;

    background:
        linear-gradient(
            145deg,
            rgba(226,200,120,.16),
            rgba(185,149,69,.035)
        );

    border:1px solid rgba(226,200,120,.18);

    color:var(--brand-light);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 12px 30px rgba(0,0,0,.3),
        0 0 22px rgba(199,168,90,.08);

    overflow:hidden;
}

.brand-mark img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    border-radius:inherit;
}

.brand-text{
    display:flex;
    flex-direction:column;
}

.brand{
    font-size:19px;
    line-height:1;

    font-weight:900;
    letter-spacing:-.3px;
}

.brand-sub{
    color:var(--muted);

    font-size:10px;

    margin-top:5px;

    letter-spacing:.2px;
}

.header-status{
    display:flex;
    align-items:center;
    gap:7px;

    color:var(--muted);

    font-size:11px;
}

.status-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--gold);

    box-shadow:
        0 0 12px rgba(199,168,90,.6);
}


/* =========================
   SCREENS
========================= */

.screen{
    display:none;

    animation:
        screenIn .42s cubic-bezier(.2,.8,.2,1) both;
}

.screen.active{
    display:block;
}

@keyframes screenIn{
    from{
        opacity:0;
        transform:translateY(12px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* =========================
   PANEL
========================= */

.panel{
    position:relative;
    overflow:hidden;

    margin-top:25px;

    padding:27px;

    border-radius:var(--radius-xl);

    background:
        linear-gradient(
            145deg,
            rgba(23,21,18,.96),
            rgba(10,10,9,.96)
        );

    border:1px solid var(--line);

    box-shadow:
        var(--shadow),
        inset 0 1px 0 rgba(255,255,255,.035);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    transition:
        border-color .25s ease,
        box-shadow .25s ease;
}

.panel::before{
    content:"";

    position:absolute;

    top:0;
    left:8%;
    right:8%;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(226,200,120,.25),
            transparent
        );
}

.panel::after{
    content:"";

    position:absolute;

    width:180px;
    height:180px;

    top:-130px;
    left:50%;

    transform:translateX(-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(199,168,90,.07),
            transparent 70%
        );

    pointer-events:none;
}

.panel:hover{
    border-color:rgba(226,200,120,.13);

    box-shadow:
        0 35px 90px rgba(0,0,0,.56),
        inset 0 1px 0 rgba(255,255,255,.04);
}


/* =========================
   TYPOGRAPHY
========================= */

h1,
h2,
h3{
    margin:0;
    color:var(--text);
    font-weight:900;
}

h1{
    font-size:25px;
    letter-spacing:-.5px;
}

h2{
    font-size:25px;
    letter-spacing:-.4px;
}

.intro{
    margin-top:9px;

    max-width:590px;

    color:var(--muted);

    line-height:1.9;

    font-size:13px;
}


/* =========================
   SECTION HEADER
========================= */

.section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:17px;
}

.section-title{
    display:flex;
    align-items:center;
    gap:9px;

    color:var(--text);

    font-size:14px;
    font-weight:800;
}

.section-icon{
    width:30px;
    height:30px;

    display:grid;
    place-items:center;

    border-radius:9px;

    background:rgba(199,168,90,.075);

    border:1px solid rgba(199,168,90,.13);

    color:var(--brand-light);

    font-size:13px;
}

.section-count{
    color:var(--muted);
    font-size:11px;
}


/* =========================
   WORD LIST
========================= */

.words-list{
    display:grid;
    gap:9px;

    max-height:390px;

    overflow:auto;

    padding:2px;

    scrollbar-width:thin;
    scrollbar-color:
        rgba(199,168,90,.25)
        transparent;
}

.word-row{
    min-height:61px;

    display:flex;
    align-items:center;

    gap:9px;

    padding:8px 9px;

    border-radius:14px;

    background:
        rgba(255,255,255,.018);

    border:1px solid rgba(255,255,255,.045);

    transition:
        background .2s ease,
        border-color .2s ease,
        transform .2s ease;
}

.word-row:hover{
    background:
        rgba(255,255,255,.028);

    border-color:
        rgba(199,168,90,.14);

    transform:translateY(-1px);
}

.word-row .num{
    width:30px;

    flex:0 0 30px;

    text-align:center;

    color:#766d5d;

    font-size:11px;
    font-weight:800;
}

.word-row input{
    direction:rtl;
}

.word-row input[type="text"]{
    flex:1;
}

.word-row .attempt-input{
    max-width:90px;
    text-align:center;
}

.attempt-label{
    color:var(--muted);

    font-size:11px;

    white-space:nowrap;
}


/* =========================
   INPUTS
========================= */

input{
    width:100%;

    min-height:43px;

    border-radius:11px;

    padding:10px 13px;

    outline:none;

    border:1px solid rgba(255,255,255,.075);

    background:
        rgba(5,5,4,.64);

    color:var(--text);

    font-family:inherit;

    transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
}

input::placeholder{
    color:#5e5a52;
}

input:hover{
    border-color:
        rgba(199,168,90,.17);
}

input:focus{
    background:
        rgba(12,11,9,.88);

    border-color:
        rgba(199,168,90,.42);

    box-shadow:
        0 0 0 3px rgba(199,168,90,.065),
        0 10px 25px rgba(0,0,0,.12);
}


/* =========================
   BUTTONS
========================= */

.actions{
    display:flex;

    align-items:center;

    gap:9px;

    flex-wrap:wrap;

    margin-top:19px;
}

.btn{
    position:relative;
    overflow:hidden;

    min-height:43px;

    padding:10px 16px;

    border-radius:11px;

    border:1px solid rgba(255,255,255,.075);

    background:
        linear-gradient(
            145deg,
            rgba(35,31,23,.9),
            rgba(16,15,13,.9)
        );

    color:var(--text-soft);

    font-family:inherit;
    font-size:12px;
    font-weight:700;

    cursor:pointer;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.035),
        0 7px 18px rgba(0,0,0,.18);

    transition:
        transform .13s ease,
        border-color .2s ease,
        background .2s ease,
        box-shadow .2s ease;
}

.btn:hover{
    transform:translateY(-1px);

    border-color:
        rgba(226,200,120,.22);

    background:
        linear-gradient(
            145deg,
            rgba(45,39,28,.95),
            rgba(19,18,15,.95)
        );

    box-shadow:
        0 12px 28px rgba(0,0,0,.25),
        inset 0 1px 0 rgba(255,255,255,.045);
}

.btn:active{
    transform:
        translateY(1px)
        scale(.975);
}

.btn.primary{
    background:
        linear-gradient(
            145deg,
            rgba(73,156,102,.34),
            rgba(42,111,69,.2)
        );

    border-color:
        rgba(106,190,132,.38);

    color:#eaffef;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.1),
        0 9px 26px rgba(0,0,0,.24),
        0 0 18px rgba(73,156,102,.08);
}

.btn.primary:hover{
    background:
        linear-gradient(
            145deg,
            rgba(83,174,113,.45),
            rgba(47,124,77,.27)
        );

    border-color:
        rgba(132,210,154,.5);
}

.btn.reset{
    color:#f0d99a;

    background:
        linear-gradient(
            145deg,
            rgba(181,139,57,.25),
            rgba(105,79,31,.15)
        );

    border-color:
        rgba(214,173,79,.25);
}

.btn.reset:hover{
    border-color:
        rgba(226,194,111,.45);

    background:
        linear-gradient(
            145deg,
            rgba(196,153,64,.34),
            rgba(118,89,35,.2)
        );
}

.btn.danger{
    color:#f0a6ad;

    background:
        linear-gradient(
            145deg,
            rgba(158,55,67,.28),
            rgba(91,35,43,.18)
        );

    border-color:
        rgba(201,87,99,.28);
}

.btn.danger:hover{
    border-color:
        rgba(225,105,117,.5);

    background:
        linear-gradient(
            145deg,
            rgba(174,62,75,.38),
            rgba(103,38,48,.24)
        );
}


/* =========================
   NOTICE
========================= */

.notice{
    display:flex;
    align-items:flex-start;
    gap:9px;

    margin-top:14px;

    padding:12px 14px;

    border-radius:12px;

    background:
        rgba(199,168,90,.035);

    border:1px solid
        rgba(199,168,90,.08);

    color:var(--muted);

    font-size:11px;

    line-height:1.8;
}

.notice::before{
    content:"i";

    width:19px;
    height:19px;

    flex:0 0 19px;

    display:grid;
    place-items:center;

    border-radius:50%;

    background:
        rgba(199,168,90,.1);

    color:var(--brand-light);

    font-size:10px;
    font-weight:900;
}


/* =========================
   GAME TOP
========================= */

.game-top{
    text-align:center;

    margin-top:25px;
}

.game-top h2{
    font-size:28px;
}

.progress{
    display:inline-flex;

    align-items:center;

    min-height:29px;

    margin-top:9px;

    padding:5px 12px;

    border-radius:999px;

    background:
        rgba(199,168,90,.045);

    border:1px solid
        rgba(199,168,90,.08);

    color:var(--muted);

    font-size:10px;
}

.message{
    min-height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin:7px auto 6px;

    color:var(--brand);

    font-size:13px;
    font-weight:700;

    transition:.2s;
}

.message.error{
    color:#c99ca3;
}

.message.success{
    color:var(--green-light);

    animation:
        successMessage .5s
        cubic-bezier(.2,.8,.2,1);
}

@keyframes successMessage{
    0%{
        opacity:0;
        transform:
            translateY(7px)
            scale(.96);
    }

    55%{
        transform:
            translateY(-2px)
            scale(1.04);
    }

    100%{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================
   PLAYER ID
========================= */

.player-id{
    width:min(440px,100%);

    margin:2px auto 17px;

    padding:14px;

    border-radius:15px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.027),
            rgba(255,255,255,.012)
        );

    border:1px solid
        rgba(255,255,255,.06);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.025);
}

.player-id label{
    display:block;

    margin-bottom:7px;

    color:var(--text-soft);

    font-size:11px;
    font-weight:800;

    text-align:right;
}

.player-id input{
    direction:ltr;
    text-align:center;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    letter-spacing:.3px;
}

.player-id input:focus{
    border-color:
        rgba(199,168,90,.46);

    box-shadow:
        0 0 0 3px
        rgba(199,168,90,.07),
        0 10px 28px rgba(0,0,0,.15);
}


/* =========================
   BOARD
========================= */

.board{
    width:min(430px,100%);

    margin:0 auto;

    display:grid;

    gap:8px;
}

.row{
    display:grid;

    grid-template-columns:
        repeat(var(--word-length),1fr);

    gap:8px;
}

.tile{
    aspect-ratio:1;

    position:relative;
    overflow:hidden;

    display:grid;
    place-items:center;

    border-radius:12px;

    border:1px solid
        rgba(226,200,120,.13);

    background:
        linear-gradient(
            145deg,
            rgba(25,22,17,.94),
            rgba(10,10,9,.96)
        );

    color:var(--text);

    font-size:
        clamp(23px,6vw,34px);

    font-weight:900;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.035),
        0 7px 18px rgba(0,0,0,.2);

    transition:
        transform .15s ease,
        border-color .15s ease,
        background .15s ease,
        box-shadow .15s ease;
}

.tile::after{
    content:"";

    position:absolute;
    inset:0;

    pointer-events:none;

    background:
        radial-gradient(
            120px circle at
            var(--mx,50%)
            var(--my,50%),
            rgba(226,200,120,.09),
            transparent 68%
        );

    opacity:0;

    transition:opacity .2s;
}

.tile:hover::after{
    opacity:1;
}

.tile.filled{
    border-color:
        rgba(226,200,120,.34);

    background:
        rgba(27,24,18,.98);
}

.tile.correct{
    background:
        linear-gradient(
            145deg,
            #78b892,
            #5fa77a
        );

    border-color:#86c39b;

    color:#08130d;
}

.tile.present{
    background:
        linear-gradient(
            145deg,
            #e0bd5e,
            #c99d3d
        );

    border-color:#e5c66f;

    color:#171207;
}

.tile.absent{
    background:
        linear-gradient(
            145deg,
            #3a3530,
            #2b2722
        );

    border-color:#4b443b;

    color:#aaa092;
}

/* =========================
   TILE FLIP REVEAL
========================= */

.tile.reveal{
    animation:
        tileFlip .6s
        ease-in-out
        both;
    transform-style:preserve-3d;
    backface-visibility:hidden;
}

@keyframes tileFlip{
    0%{
        transform:rotateX(0deg);
    }

    49%{
        transform:rotateX(90deg);
    }

    50%{
        transform:rotateX(90deg);
    }

    100%{
        transform:rotateX(0deg);
    }
}

.tile.correct.win-animation{
    animation:
        correctTile .55s
        cubic-bezier(.2,.9,.25,1.3)
        both,
        correctGlow 1s
        ease-in-out
        infinite alternate;
}

@keyframes correctTile{
    0%{
        transform:
            scale(.82)
            rotateX(0);
        opacity:.45;
    }

    55%{
        transform:
            scale(1.12)
            rotateX(18deg);
        opacity:1;
    }

    100%{
        transform:
            scale(1)
            rotateX(0);
    }
}

@keyframes correctGlow{
    from{
        box-shadow:
            inset 0 1px 0 rgba(255,255,255,.12),
            0 0 0 rgba(110,157,132,0);
    }

    to{
        box-shadow:
            inset 0 1px 0 rgba(255,255,255,.17),
            0 0 25px rgba(110,157,132,.3);
    }
}

.row.word-solved{
    animation:
        solvedRow .7s ease both;
}

@keyframes solvedRow{
    0%{
        transform:scale(1);
    }

    40%{
        transform:scale(1.025);
    }

    100%{
        transform:scale(1);
    }
}


/* =========================
   KEYBOARD
========================= */

.keyboard{
    width:min(575px,100%);

    margin:22px auto 0;

    display:grid;

    gap:7px;
}

.key-row{
    display:flex;

    justify-content:center;

    gap:5px;
}

.key{
    position:relative;
    overflow:hidden;

    min-width:
        clamp(27px,7vw,44px);

    height:50px;

    padding:0 5px;

    border-radius:9px;

    border:1px solid
        rgba(255,255,255,.065);

    background:
        linear-gradient(
            145deg,
            #201d18,
            #12110f
        );

    color:#d1c8b8;

    font-family:inherit;

    font-size:
        clamp(12px,2.8vw,15px);

    font-weight:800;

    cursor:pointer;

    user-select:none;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.03),
        0 5px 13px rgba(0,0,0,.2);

    transition:
        transform .08s ease,
        border-color .18s ease,
        background .18s ease;
}

.key::after{
    content:"";

    position:absolute;
    inset:0;

    pointer-events:none;

    background:
        radial-gradient(
            110px circle at
            var(--mx,50%)
            var(--my,50%),
            rgba(226,200,120,.1),
            transparent 68%
        );

    opacity:0;

    transition:opacity .18s;
}

.key:hover{
    transform:translateY(-1px);

    border-color:
        rgba(226,200,120,.18);

    background:
        linear-gradient(
            145deg,
            #29251e,
            #171511
        );
}

.key:hover::after{
    opacity:1;
}

.key:active{
    transform:
        translateY(2px)
        scale(.95);
}

.key.wide{
    min-width:
        clamp(55px,12vw,72px);

    font-size:11px;
}

.key.correct{
    background:#526f61;
    border-color:
        rgba(110,157,132,.3);

    color:#d5e8dc;
}

.key.present{
    background:#76653a;
    border-color:
        rgba(199,168,90,.3);

    color:#f0dfb4;
}

.key.absent{
    background:#1b1916;

    color:#6d6559;
}


/* =========================
   RESULT
========================= */

.result{
    text-align:center;

    padding-top:31px;
}

.result-icon{
    width:58px;
    height:58px;

    display:grid;
    place-items:center;

        rgba(199,168,90,.09);

        0 15px 35px rgba(0,0,0,.25);
}

.result .big{

    font-weight:900;

    color:var(--brand-light);

    letter-spacing:-1px;
}

.summary{
    color:var(--muted);

    font-size:12px;

    line-height:2;
}

.summary b{
    color:var(--text-soft);
}


/* =========================
   WINNER IDS
========================= */

.winner-ids{
    margin-top:21px;

    padding:17px;

    border-radius:15px;

    background:
        linear-gradient(
            145deg,
            rgba(199,168,90,.075),

        );

        rgba(199,168,90,.16);
}

.winner-ids-title{

    color:var(--brand-light);

    font-weight:900;
}

.winner-id{
    display:inline-block;

    margin:4px;

    padding:8px 12px;

    border-radius:9px;

    background:
        rgba(9,9,8,.84);

    border:1px solid
        rgba(199,168,90,.18);

    color:#e4d5ae;

    direction:ltr;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size:12px;

    animation:
        winnerAppear .4s
        ease both;
}

.no-winners{
    color:var(--muted);

    font-size:12px;

    padding:4px;
}

@keyframes winnerAppear{
    from{
        opacity:0;

        transform:
            translateY(8px)
            scale(.92);
    }

    to{
        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================
   RIPPLE
========================= */

.ripple{
    position:absolute;

    border-radius:50%;

    transform:scale(0);

    animation:
        ripple .55s
        ease-out;

    background:
        rgba(226,200,120,.18);

    pointer-events:none;
}

@keyframes ripple{
    to{
        transform:scale(4);
        opacity:0;
    }
}


/* =========================
   WIN PARTICLES
========================= */

.win-particle{
    position:fixed;

    width:7px;
    height:7px;

    border-radius:50%;

    pointer-events:none;

    z-index:20;

    background:var(--gold-light);

    box-shadow:
        0 0 12px
        rgba(226,200,120,.65);

    animation:
        winParticle
        900ms
        cubic-bezier(.15,.7,.2,1)
        forwards;
}

@keyframes winParticle{
    0%{
        opacity:1;

        transform:
            translate3d(0,0,0)
            scale(1);
    }

    100%{
        opacity:0;

        transform:
            translate3d(
                var(--dx),
                var(--dy),
                0
            )
            rotate(360deg)
            scale(.2);
    }
}

    }

<script>
(() => {

"use strict";


/* =========================
   ARABIC KEYBOARD
========================= */

const ARABIC_ROWS = [

    [
        "ض","ص","ث","ق","ف",
        "غ","ع","ه","خ","ح","ج"
    ],

    [
        "ش","س","ي","ب","ل",
        "ا","ت","ن","م","ك","ط"
    ],

    [
        "ئ","ء","ؤ","ر","لا",
        "ى","ة","و","ز","ظ","د"
    ]

];


const KEY_MAP = {

    "q":"ض",
    "w":"ص",
    "e":"ث",
    "r":"ق",
    "t":"ف",
    "y":"غ",
    "u":"ع",
    "i":"ه",
    "o":"خ",
    "p":"ح",

    "[":"ج",
    "]":"د",

    "a":"ش",
    "s":"س",
    "d":"ي",
    "f":"ب",
    "g":"ل",
    "h":"ا",
    "j":"ت",
    "k":"ن",
    "l":"م",
    ";":"ك",
    "'":"ط",

    "z":"ئ",
    "x":"ء",
    "c":"ؤ",
    "v":"ر",
    "b":"لا",
    "n":"ى",
    "m":"ة",
    ",":"و",
    ".":"ز",
    "/":"ظ"
};


/* =========================
   GAME STATE
========================= */

let words = [];

let attemptsLimit = 6;

let wordAttempts = [];

let wordLength = 5;

let currentWordIndex = 0;

let currentAttempt = 0;

let currentGuess = "";

let keyState = {};

let solvedCount = 0;

let failedCount = 0;

let winnerIDs = [];


/* =========================
   ELEMENTS
========================= */

const $ =
    id => document.getElementById(id);


const setupScreen =
    $("setupScreen");

const gameScreen =
    $("gameScreen");

const resultScreen =
    $("resultScreen");

const wordsList =
    $("wordsList");

const board =
    $("board");

const keyboard =
    $("keyboard");

const message =
    $("message");

const progress =
    $("progress");

const playerId =
    $("playerId");

const wordCount =
    $("wordCount");


/* =========================
   NORMALIZE ARABIC
========================= */

function normalizeArabic(value){

    return String(value || "")

        .normalize("NFC")

        .replace(
            /[\u064B-\u065F\u0670\u06D6-\u06ED]/g,
            ""
        )

        .replace(/[أإآ]/g,"ا")

        .replace(/\s+/g,"")

        .trim();
}


/* =========================
   VALIDATION
========================= */

function isArabicLetter(ch){

    return /[\u0600-\u06FF]/.test(ch);

}


function getWordLength(word){

    return [
        ...normalizeArabic(word)
    ].length;

}


function isValidWord(word){

    const chars =
        [...normalizeArabic(word)];

    return (
        chars.length > 0 &&
        chars.every(isArabicLetter)
    );

}


/* =========================
   SCREEN
========================= */

function showScreen(screen){

    [
        setupScreen,
        gameScreen,
        resultScreen
    ].forEach(
        s => s.classList.remove("active")
    );

    screen.classList.add("active");

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================
   WORD ROW
========================= */

function createWordRow(
    value="",
    attempts=6
){

    const row =
        document.createElement("div");

    row.className =
        "word-row";


    const num =
        document.createElement("div");

    num.className =
        "num";


    const input =
        document.createElement("input");

    input.type =
        "text";

    input.maxLength =
        30;

    input.placeholder =
        "اكتب الكلمة";

    input.autocomplete =
        "off";

    input.spellcheck =
        false;

    input.value =
        value;


    const attemptsInput =
        document.createElement("input");

    attemptsInput.type =
        "number";

    attemptsInput.min =
        "1";

    attemptsInput.max =
        "20";

    attemptsInput.value =
        attempts;

    attemptsInput.className =
        "attempt-input";

    attemptsInput.title =
        "عدد المحاولات لهذه الكلمة";


    const attemptsLabel =
        document.createElement("span");

    attemptsLabel.className =
        "attempt-label";

    attemptsLabel.textContent =
        "محاولات";


    const remove =
        document.createElement("button");

    remove.type =
        "button";

    remove.className =
        "btn danger remove-word";

    remove.textContent =
        "حذف";


    remove.addEventListener(
        "click",
        () => {

            row.remove();

            updateWordNumbers();

        }
    );


    row.append(
        num,
        input,
        attemptsInput,
        attemptsLabel,
        remove
    );


    wordsList.appendChild(row);

    updateWordNumbers();

}


/* =========================
   WORD NUMBERS
========================= */

function updateWordNumbers(){

    [
        ...wordsList.children
    ].forEach(
        (row,index) => {

            row.querySelector(
                ".num"
            ).textContent =
                index + 1;

        }
    );


    const count =
        wordsList.children.length;


    wordCount.textContent =
        `${count} ${count === 1 ? "كلمة" : "كلمات"}`;

}


/* =========================
   MESSAGE
========================= */

function setMessage(
    text="",
    error=false,
    success=false
){

    message.textContent =
        text;


    let classes =
        "message";


    if(error){
        classes += " error";
    }


    if(success){
        classes += " success";
    }


    message.className =
        classes;

}


/* =========================
   START GAME
========================= */

function startGame(){

    const rows =
        [...wordsList.children];


    if(!rows.length){

        alert(
            "أضف كلمة واحدة على الأقل."
        );

        return;
    }


    const entered =
        rows.map(row => ({

            word:
                normalizeArabic(
                    row.querySelector(
                        "input[type=text]"
                    ).value
                ),

            attempts:
                Math.max(
                    1,
                    Math.min(
                        20,
                        parseInt(
                            row.querySelector(
                                ".attempt-input"
                            ).value,
                            10
                        ) || 6
                    )
                )

        }));


    if(
        entered.some(
            item => !item.word
        )
    ){

        alert(
            "يرجى إدخال جميع الكلمات قبل بدء اللعبة."
        );

        return;
    }


    const invalidIndex =
        entered.findIndex(
            item =>
                !isValidWord(item.word)
        );


    if(invalidIndex !== -1){

        alert(
            `الكلمة رقم ${invalidIndex+1} يجب أن تحتوي على أحرف عربية فقط.`
        );


        rows[
            invalidIndex
        ]
        .querySelector(
            "input[type=text]"
        )
        .focus();


        return;
    }


    words =
        entered.map(
            item => item.word
        );


    wordAttempts =
        entered.map(
            item => item.attempts
        );


    currentWordIndex =
        0;

    currentAttempt =
        0;

    currentGuess =
        "";

    keyState =
        {};

    solvedCount =
        0;

    failedCount =
        0;

    winnerIDs =
        [];


    playerId.value =
        "";


    wordLength =
        getWordLength(
            words[0]
        );


    attemptsLimit =
        wordAttempts[0];


    buildBoard();

    buildKeyboard();

    updateProgress();


    setMessage(
        `اكتب تخمينًا من ${wordLength} أحرف.`
    );


    showScreen(
        gameScreen
    );


    setTimeout(
        () => playerId.focus(),
        350
    );

}


/* =========================
   BOARD
========================= */

function buildBoard(){

    board.innerHTML =
        "";

    board.style.setProperty(
        "--word-length",
        wordLength
    );


    for(
        let r=0;
        r<attemptsLimit;
        r++
    ){

        const row =
            document.createElement("div");

        row.className =
            "row";


        for(
            let c=0;
            c<wordLength;
            c++
        ){

            const tile =
                document.createElement("div");

            tile.className =
                "tile";

            tile.dataset.row =
                r;

            tile.dataset.col =
                c;


            row.appendChild(
                tile
            );

        }


        board.appendChild(
            row
        );

    }

}


/* =========================
   KEYBOARD
========================= */

function buildKeyboard(){

    keyboard.innerHTML =
        "";


    ARABIC_ROWS.forEach(
        (letters,rowIndex) => {

            const row =
                document.createElement("div");

            row.className =
                "key-row";


            letters.forEach(
                letter => {

                    row.appendChild(
                        makeKey(
                            letter,
                            letter,
                            false
                        )
                    );

                }
            );


            if(rowIndex === 2){

                const controls =
                    document.createElement("div");

                controls.className =
                    "key-row";

                controls.style.marginTop =
                    "0";


                controls.appendChild(
                    makeKey(
                        "⌫ حذف",
                        "backspace",
                        true
                    )
                );


                controls.appendChild(
                    makeKey(
                        "تأكيد ↵",
                        "enter",
                        true
                    )
                );


                keyboard.appendChild(
                    row
                );

                keyboard.appendChild(
                    controls
                );

                return;
            }


            keyboard.appendChild(
                row
            );

        }
    );

}


/* =========================
   MAKE KEY
========================= */

function makeKey(
    label,
    value,
    wide
){

    const button =
        document.createElement("button");


    button.className =
        "key" +
        (wide ? " wide" : "");


    button.textContent =
        label;


    button.dataset.key =
        value;


    button.addEventListener(
        "click",
        () => handleKey(value)
    );


    return button;

}


/* =========================
   PROGRESS
========================= */

function updateProgress(){

    progress.textContent =
        `الكلمة ${currentWordIndex+1} من ${words.length} • المحاولات: ${attemptsLimit} • طول الكلمة: ${wordLength}`;

}


/* =========================
   RENDER GUESS
========================= */

function renderGuess(){

    const row =
        board.children[
            currentAttempt
        ];


    if(!row) return;


    const chars =
        [...currentGuess];


    [
        ...row.children
    ].forEach(
        (tile,i) => {

            tile.textContent =
                chars[i] || "";


            tile.classList.toggle(
                "filled",
                Boolean(chars[i])
            );

        }
    );

}


/* =========================
   HANDLE KEY
========================= */

function handleKey(key){

    if(key === "backspace"){

        currentGuess =
            [
                ...currentGuess
            ]
            .slice(0,-1)
            .join("");


        renderGuess();

        return;
    }


    if(key === "enter"){

        submitGuess();

        return;
    }


    const chars =
        [
            ...normalizeArabic(key)
        ];


    if(
        !chars.length ||
        !chars.every(
            isArabicLetter
        )
    ){
        return;
    }


    if(
        [...currentGuess].length +
        chars.length >
        wordLength
    ){
        return;
    }


    currentGuess +=
        chars.join("");


    renderGuess();

}


/* =========================
   EVALUATE
========================= */

function evaluateGuess(
    guess,
    answer
){

    const g =
        [
            ...normalizeArabic(guess)
        ];


    const a =
        [
            ...normalizeArabic(answer)
        ];


    const result =
        Array(
            wordLength
        ).fill("absent");


    const remaining =
        {};


    for(
        let i=0;
        i<wordLength;
        i++
    ){

        if(
            g[i] === a[i]
        ){

            result[i] =
                "correct";

        }else{

            remaining[a[i]] =
                (
                    remaining[a[i]]
                    || 0
                ) + 1;

        }

    }


    for(
        let i=0;
        i<wordLength;
        i++
    ){

        if(
            result[i] === "correct"
        ){
            continue;
        }


        const ch =
            g[i];


        if(
            remaining[ch] > 0
        ){

            result[i] =
                "present";

            remaining[ch]--;

        }

    }


    return result;

}


/* =========================
   KEYBOARD STATE
========================= */

function updateKeyboard(
    guess,
    result
){

    const priority = {

        absent:1,
        present:2,
        correct:3

    };


    [...guess].forEach(
        (ch,i) => {

            const next =
                result[i];


            if(
                (
                    priority[next] ||
                    0
                ) >
                (
                    priority[
                        keyState[ch]
                    ] ||
                    0
                )
            ){

                keyState[ch] =
                    next;

            }

        }
    );


    document
        .querySelectorAll(".key")
        .forEach(
            btn => {

                const state =
                    keyState[
                        btn.dataset.key
                    ];


                btn.classList.remove(
                    "correct",
                    "present",
                    "absent"
                );


                if(state){

                    btn.classList.add(
                        state
                    );

                }

            }
        );

}


/* =========================
   PAINT RESULT
========================= */

function paintResult(result){

    const row =
        board.children[
            currentAttempt
        ];


    const chars =
        [...currentGuess];


    [...row.children].forEach(
        (tile,i) => {

            const state =
                result[i];


            tile.classList.remove(
                "filled",
                "correct",
                "present",
                "absent",
                "win-animation",
                "reveal"
            );


            tile.textContent =
                chars[i];


            /*
             * نفس فكرة الوِرد:
             * يبدأ المربع بلونه الطبيعي،
             * ينغلق بالفلب، وعند منتصف الفلب
             * يظهر لون النتيجة، ثم ينفتح.
             */
            tile.style.animationDelay =
                `${i * 120}ms`;

            void tile.offsetWidth;

            tile.classList.add(
                "reveal"
            );


            setTimeout(
                () => {

                    tile.classList.add(
                        state
                    );

                },
                i * 120 + 300
            );

        }
    );

}


/* =========================
   WIN EFFECT
========================= */

function celebrateWin(){

    const row =
        board.children[
            currentAttempt
        ];


    if(row){

        row.classList.add(
            "word-solved"
        );


        [...row.children].forEach(
            (tile,index) => {

                setTimeout(
                    () => {

                        tile.classList.add(
                            "win-animation"
                        );

                    },
                    index * 90
                );

            }
        );

    }


    const rect =
        board.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    for(
        let i=0;
        i<28;
        i++
    ){

        const particle =
            document.createElement("span");


        particle.className =
            "win-particle";


        particle.style.left =
            `${centerX}px`;


        particle.style.top =
            `${centerY}px`;


        const angle =
            Math.random() *
            Math.PI *
            2;


        const distance =
            80 +
            Math.random() *
            190;


        particle.style.setProperty(
            "--dx",
            `${Math.cos(angle) * distance}px`
        );


        particle.style.setProperty(
            "--dy",
            `${Math.sin(angle) * distance}px`
        );


        particle.style.animationDelay =
            `${Math.random() * 120}ms`;


        document.body.appendChild(
            particle
        );


        setTimeout(
            () => particle.remove(),
            1100
        );

    }

}


/* =========================
   SUBMIT GUESS
========================= */

function submitGuess(){

    if(
        !playerId.value.trim()
    ){

        setMessage(
            "يرجى إدخال ID الخاص بك قبل التخمين.",
            true
        );


        playerId.focus();

        return;
    }


    if(
        [...currentGuess].length !==
        wordLength
    ){

        setMessage(
            `يجب أن يكون التخمين من ${wordLength} أحرف.`,
            true
        );

        return;
    }


    const answer =
        words[
            currentWordIndex
        ];


    const result =
        evaluateGuess(
            currentGuess,
            answer
        );


    paintResult(result);


    updateKeyboard(
        currentGuess,
        result
    );


    const solved =
        result.every(
            x => x === "correct"
        );


    if(solved){

        solvedCount++;


        const currentPlayerID =
            playerId.value.trim();


        if(
            currentPlayerID &&
            !winnerIDs.includes(
                currentPlayerID
            )
        ){

            winnerIDs.push(
                currentPlayerID
            );

        }


        celebrateWin();


        setMessage(
            `أحسنت! 🎉 تم تسجيل ID: ${currentPlayerID} كفائز`,
            false,
            true
        );


        currentAttempt++;

        currentGuess = "";


        setTimeout(
            () => {

                if(
                    currentWordIndex <
                    words.length - 1
                ){

                    currentWordIndex++;

                    currentAttempt = 0;

                    attemptsLimit =
                        wordAttempts[
                            currentWordIndex
                        ];

                    wordLength =
                        getWordLength(
                            words[
                                currentWordIndex
                            ]
                        );

                    keyState =
                        {};

                    /*
                     * إصلاح مشكلة ID:
                     * تفريغ ID اللاعب السابق
                     * قبل بدء الكلمة الجديدة.
                     */
                    playerId.value = "";

                    buildBoard();

                    buildKeyboard();

                    updateProgress();

                    setMessage(
                        "كلمة جديدة. أدخل ID الخاص بك ثم ابدأ بالتخمين."
                    );

                    /*
                     * إعطاء التركيز مباشرة لخانة ID
                     * الخاصة بالكلمة الجديدة.
                     */
                    setTimeout(
                        () => playerId.focus(),
                        150
                    );

                }else{

                    finishGame();

                }

            },
            1200
        );


        return;
    }


    currentAttempt++;

    currentGuess = "";


    if(
        currentAttempt >=
        attemptsLimit
    ){

        failedCount++;


        setMessage(
            `انتهت المحاولات. الكلمة كانت: ${answer}`,
            true
        );


        setTimeout(
            () => {

                if(
                    currentWordIndex <
                    words.length - 1
                ){

                    currentWordIndex++;

                    currentAttempt = 0;

                    attemptsLimit =
                        wordAttempts[
                            currentWordIndex
                        ];

                    wordLength =
                        getWordLength(
                            words[
                                currentWordIndex
                            ]
                        );

                    keyState =
                        {};

                    /*
                     * إصلاح مشكلة ID:
                     * تفريغ ID اللاعب السابق
                     * قبل الانتقال للكلمة التالية.
                     */
                    playerId.value = "";

                    buildBoard();

                    buildKeyboard();

                    updateProgress();

                    setMessage(
                        "ننتقل للكلمة التالية. أدخل ID اللاعب الجديد."
                    );

                    /*
                     * التركيز على خانة ID الجديدة.
                     */
                    setTimeout(
                        () => playerId.focus(),
                        150
                    );

                }else{

                    finishGame();

                }

            },
            1400
        );

    }else{

        setMessage("");

    }

}


/* =========================
   FINISH GAME
========================= */

function finishGame(){

    $("resultBig").textContent =
        `${solvedCount} / ${words.length}`;


    $("resultSummary").innerHTML =
        `تم حل <b>${solvedCount}</b> كلمات بنجاح، ولم يتم حل <b>${failedCount}</b> كلمات.<br>
         عدد المحاولات للكلمة الأخيرة: <b>${attemptsLimit}</b><br>
         عدد الأحرف للكلمة الأخيرة: <b>${wordLength}</b>`;


    const winnerContainer =
        $("winnerIds");


    winnerContainer.innerHTML =
        "";


    if(winnerIDs.length){

        const title =
            document.createElement("div");


        title.className =
            "winner-ids-title";


        title.textContent =
            "🏆 IDs الفائزين";


        winnerContainer.appendChild(
            title
        );


        winnerIDs.forEach(
            (id,index) => {

                const idElement =
                    document.createElement("span");


                idElement.className =
                    "winner-id";


                idElement.textContent =
                    id;


                idElement.style.animationDelay =
                    `${index * 100}ms`;


                winnerContainer.appendChild(
                    idElement
                );

            }
        );

    }else{

        winnerContainer.innerHTML =
            `
            <div class="no-winners">
                لم يتم تسجيل أي فائز في هذه اللعبة.
            </div>
            `;

    }


    showScreen(
        resultScreen
    );

}

/* =========================
   PHYSICAL KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    e => {

        if(
            !gameScreen.classList.contains(
                "active"
            )
        ){
            return;
        }


        if(
            document.activeElement ===
            playerId
        ){

            if(
                e.key === "Enter"
            ){

                e.preventDefault();


                if(
                    playerId.value.trim()
                ){

                    playerId.blur();


                    setMessage(
                        `تم حفظ ID: ${playerId.value.trim()}`
                    );

                }else{

                    setMessage(
                        "يرجى إدخال ID الخاص بك.",
                        true
                    );

                }

            }

            return;
        }


        if(
            e.key === "Enter"
        ){

            e.preventDefault();

            handleKey("enter");

            return;
        }


        if(
            e.key === "Backspace" ||
            e.key === "Delete"
        ){

            e.preventDefault();

            handleKey("backspace");

            return;
        }


        const physicalKey =
            e.key.length === 1
                ? e.key.toLowerCase()
                : e.key;


        const mappedKey =
            KEY_MAP[
                physicalKey
            ] ||
            physicalKey;


        const key =
            normalizeArabic(
                mappedKey
            );


        if(
            [...key].length === 1 &&
            isArabicLetter(key)
        ){

            e.preventDefault();

            handleKey(key);

        }

    }
);

/* =========================
   POINTER EFFECT
========================= */

document.addEventListener(
    "pointermove",
    e => {

        if(
            !window.matchMedia(
                "(pointer:fine)"
            ).matches
        ){
            return;
        }


        const element =
            e.target.closest(
                ".tile,.key,.panel"
            );


        if(!element){
            return;
        }


        const rect =
            element.getBoundingClientRect();


        element.style.setProperty(
            "--mx",
            `${((e.clientX - rect.left) / rect.width) * 100}%`
        );


        element.style.setProperty(
            "--my",
            `${((e.clientY - rect.top) / rect.height) * 100}%`
        );


        if(
            element.classList.contains(
                "tile"
            )
        ){

            const x =
                ((e.clientX - rect.left) /
                rect.width) -
                .5;


            const y =
                ((e.clientY - rect.top) /
                rect.height) -
                .5;


            element.style.transform =
                `perspective(600px) rotateX(${(-y*2)}deg) rotateY(${x*2}deg) translateY(-1px)`;

        }

    }
);


/* =========================
   TILE RESET
========================= */

document.addEventListener(
    "mouseout",
    e => {

        const element =
            e.target.closest(
                ".tile"
            );


        if(
            element &&
            !element.matches(":hover")
        ){

            element.style.transform =
                "";

        }

    }
);


/* =========================
   RIPPLE EFFECT
========================= */

document.addEventListener(
    "click",
    e => {

        const button =
            e.target.closest(
                ".btn,.key,.icon-button"
            );


        if(!button){
            return;
        }


        const rect =
            button.getBoundingClientRect();


        const ripple =
            document.createElement("span");


        ripple.className =
            "ripple";


        const size =
            Math.max(
                rect.width,
                rect.height
            );


        ripple.style.width =
            ripple.style.height =
            `${size}px`;


        ripple.style.left =
            `${e.clientX - rect.left - size/2}px`;


        ripple.style.top =
            `${e.clientY - rect.top - size/2}px`;


        button.appendChild(
            ripple
        );


        setTimeout(
            () => ripple.remove(),
            600
        );

    }
);


/* =========================
   INITIAL WORD
========================= */

createWordRow(
    "",
    6
);

})();
